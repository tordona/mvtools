  <style>
    :root {
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --theme-color: #0078d4;
      --sidebar-width: 290px;
      --content-max-width: 1120px;
      --code-font-family: "Cascadia Code", "Fira Code", Consolas, Monaco, monospace;
      --table-cell-padding: 0.75em 1em;
    }
    .app-name-link img {
      max-height: 38px;
    }
    .sidebar-nav strong {
      font-size: 0.82em;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #8b949e;
    }
    .badge {
      display: inline-block;

      font-size: 12px;
      border-radius: 12px;
      background: #1f6feb;
      color: #fff;
    }
    /* Table layout and responsive styling */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin: 1.5rem 0;
      -webkit-overflow-scrolling: touch;
    }
    .markdown-section table {
      display: table !important;
      width: 100% !important;
      table-layout: auto;
      border-collapse: collapse;
      margin: 1.5rem 0;
    }
    .markdown-section table th,
    .markdown-section table td {
      padding: var(--table-cell-padding);
      vertical-align: top;
      overflow-wrap: break-word;

<body>
  <div id="app">Loading MVTools2 Documentation Hub...</div>

      loadSidebar: true,
      auto2top: true,
      subMaxLevel: 3,
      maxLevel: 4,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results found',
        depth: 4
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied'
      },
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true
      },
      'flexible-alerts': {
        style: 'callout'
      },
      plugins: [
        function(hook, vm) {
          hook.afterEach(function(html, next) {
            var wrapped = html.replace(/<table[\s\S]*?<\/table>/gi, function(match) {
              return '<div class="table-wrapper">' + match + '</div>';
            });
            next(wrapped);
          });
        }
      ]
    }
